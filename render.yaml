services:
  - type: web
    name: ai-knowledge-assistant-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: UPLOAD_DIR
        value: ./uploads
      - key: DATA_DIR
        value: ./data
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma
      - key: CHROMA_COLLECTION_NAME
        value: knowledge_base
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: LLM_PROVIDER
        value: huggingface_api
      - key: HF_INFERENCE_MODEL
        value: mistralai/Mistral-7B-Instruct-v0.2
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RAG_TOP_K
        value: "5"
      - key: RAG_CHUNK_SIZE
        value: "512"
      - key: RAG_CHUNK_OVERLAP
        value: "64"
      - key: AGENT_MAX_ITERATIONS
        value: "5"
      - key: AGENT_TIMEOUT_SECONDS
        value: "120"
      - key: NEWS_FETCH_INTERVAL_MINUTES
        value: "60"
